<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .lost-page {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      gap: 24px;
    }

    .lost-img {
      max-width: 320px;
      width: 100%;
      animation: floatLost 4s ease-in-out infinite alternate;
    }

    @keyframes floatLost {
      0% { transform: translateY(0) rotate(-0.5deg); }
      100% { transform: translateY(-8px) rotate(0.5deg); }
    }

    .lost-page h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      color: var(--ice-white);
    }

    .lost-page p {
      font-size: 1.05rem;
      color: var(--shadow-blue);
      max-width: 420px;
      margin: 0 auto;
    }

    .lost-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
  </style>
</head>

<body class="page-transition">

<nav class="site-nav">
  <div class="nav-inner">
    <a href="/index.html" class="nav-brand">
      <span class="brand-accent">US</span> History
    </a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false">&#9776;</button>
    <ul class="nav-links">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/stories/">Stories</a></li>
      <li><a href="/games.html">Games</a></li>
      <li><a href="/resources.html">Resources</a></li>
      <li><a href="/vocab.html">Vocab</a></li>
      <li><a href="/timeline.html">Timeline</a></li>
    </ul>
  </div>
</nav>

<main class="lost-page">
  <img class="lost-img" src="/assets/lost.png" alt="A torn, rolled-up parchment map with a broken wax seal">
  <h1>This Page Is History</h1>
  <p>This page didn't make it into the record. Head back home, or go play a game while it's sorted out.</p>
  <div class="lost-actions">
    <a href="/index.html" class="btn btn--primary">Back to Home</a>
    <a href="/games.html" class="btn">Play a Game</a>
  </div>
</main>

<script src="/js/main.js"></script>
</body>
</html>
