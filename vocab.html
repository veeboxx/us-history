<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Review — US History</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    .page-hero {
      background: var(--surface);
      border-bottom: 1px solid rgba(4,43,88,0.08);
      padding: 48px 24px 32px;
      text-align: center;
    }

    .page-hero h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 3.2rem);
      text-transform: none;
      letter-spacing: -0.01em;
    }

    .page-hero h1 em { font-style: italic; color: var(--ice-blue); }

    .page-hero p { margin: 10px auto 0; color: var(--shadow-blue); font-size: 0.95rem; }

    /* Unit tabs */
    .unit-tabs {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(4,43,88,0.06);
    }

    .unit-tab {
      padding: 8px 18px;
      border-radius: 100px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--shadow-blue);
      background: none;
      border: 1px solid rgba(4,43,88,0.1);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .unit-tab:hover,
    .unit-tab.active {
      color: var(--ice-blue);
      background: rgba(239, 155, 12, 0.1);
      border-color: rgba(239, 155, 12, 0.3);
    }

    /* Card counter */
    .card-counter {
      text-align: center;
      padding: 20px 24px 0;
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--shadow-blue);
    }

    .card-counter .current-num { color: var(--ice-blue); font-size: 0.85rem; }

    /* Flashcard area */
    .flashcard-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px 24px 48px;
      min-height: 340px;
    }

    .nav-arrow {
      background: none;
      border: 1px solid rgba(4,43,88,0.12);
      color: var(--shadow-blue);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .nav-arrow:hover {
      color: var(--ice-blue);
      background: rgba(239, 155, 12, 0.08);
      border-color: rgba(239, 155, 12, 0.3);
    }

    /* The card itself */
    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 520px;
      height: 260px;
      cursor: pointer;
    }

    .flashcard {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }

    /* Front — term */
    .flashcard-front {
      background: var(--surface-card);
      border: 1px solid rgba(4, 43, 88, 0.1);
      box-shadow: 0 8px 40px rgba(4,43,88,0.12);
    }

    .flashcard-front .card-label {
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--shadow-blue);
      margin-bottom: 16px;
    }

    .flashcard-front .card-term {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 400;
      font-style: italic;
      color: var(--ice-white);
      line-height: 1.2;
    }

    .flashcard-front .card-hint {
      margin-top: 20px;
      font-size: 0.7rem;
      color: var(--boundless);
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Back — definition */
    .flashcard-back {
      background: linear-gradient(135deg, rgba(239,155,12,0.12), rgba(239,155,12,0.04));
      border: 1px solid rgba(239, 155, 12, 0.25);
      box-shadow: 0 8px 40px rgba(4,43,88,0.12);
      transform: rotateY(180deg);
    }

    .flashcard-back .card-label {
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--ice-blue);
      margin-bottom: 16px;
    }

    .flashcard-back .card-def {
      font-family: var(--font-body);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: var(--ice-white);
      line-height: 1.6;
      max-width: 400px;
    }

    /* Shuffle button */
    .shuffle-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 24px 48px;
    }

    .shuffle-btn {
      padding: 8px 20px;
      border-radius: 100px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--shadow-blue);
      background: none;
      border: 1px solid rgba(4,43,88,0.1);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .shuffle-btn:hover {
      color: var(--ice-blue);
      background: rgba(239, 155, 12, 0.08);
      border-color: rgba(239, 155, 12, 0.2);
    }

    /* All terms grid (below flashcard) */
    .terms-header {
      text-align: center;
      padding: 40px 24px 24px;
      border-top: 1px solid rgba(4,43,88,0.06);
    }

    .terms-header h2 {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .terms-grid {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .term-card {
      background: var(--surface-card);
      border: 1px solid rgba(4,43,88,0.06);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .term-card:hover {
      border-color: rgba(239,155,12,0.2);
      transform: translateY(-2px);
    }

    .term-card h4 {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--ice-blue);
      margin-bottom: 6px;
    }

    .term-card p {
      font-size: 0.82rem;
      color: var(--fog);
      line-height: 1.45;
      margin: 0;
    }

    @media (max-width: 580px) {
      .flashcard-wrapper { height: 220px; }
      .flashcard-area { padding: 24px 12px 36px; }
      .nav-arrow { padding: 10px 12px; font-size: 1.1rem; }
    }
  </style>
</head>

<body class="page-transition">

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand"><span class="brand-accent">US</span> History</a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false">&#9776;</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="stories/">Stories</a></li>
      <li><a href="games.html">Games</a></li>
      <li><a href="resources.html">Resources</a></li>
      <li><a href="vocab.html">Vocab</a></li>
      <li><a href="timeline.html">Timeline</a></li>
    </ul>
  </div>
</nav>

<header class="page-hero">
  <h1>Vocab <em>Review</em></h1>
  <p>Tap a card to flip. Arrow keys or swipe to navigate.</p>
</header>

<div class="unit-tabs" id="unitTabs"></div>

<div class="card-counter" id="counter"></div>

<div class="flashcard-area">
  <button class="nav-arrow" onclick="prev()" aria-label="Previous card">&larr;</button>
  <div class="flashcard-wrapper" onclick="flip()">
    <div class="flashcard" id="flashcard">
      <div class="flashcard-face flashcard-front">
        <div class="card-label">Term</div>
        <div class="card-term" id="termText"></div>
        <div class="card-hint">tap to reveal</div>
      </div>
      <div class="flashcard-face flashcard-back">
        <div class="card-label">Definition</div>
        <div class="card-def" id="defText"></div>
      </div>
    </div>
  </div>
  <button class="nav-arrow" onclick="next()" aria-label="Next card">&rarr;</button>
</div>

<div class="shuffle-bar">
  <button class="shuffle-btn" onclick="shuffle()">⟳ Shuffle</button>
  <button class="shuffle-btn" onclick="resetOrder()">↺ Reset Order</button>
</div>

<div class="terms-header">
  <h2>All Terms</h2>
</div>
<div class="terms-grid" id="termsGrid"></div>

<footer class="site-footer">
  <p>&copy; 2025&ndash;2026 US History &middot; [Grade Level]</p>
</footer>

<script src="js/main.js"></script>
<script>
/* === VOCAB DATA (placeholder — swap in real terms per unit) === */
const vocabData = {
  "Unit 1: [Title]": [
    { term: "[Term]", def: "[Definition]" },
    { term: "[Term]", def: "[Definition]" },
    { term: "[Term]", def: "[Definition]" },
  ],
  "Unit 2: [Title]": [
    { term: "[Term]", def: "[Definition]" },
    { term: "[Term]", def: "[Definition]" },
    { term: "[Term]", def: "[Definition]" },
  ],
  "Unit 3: [Title]": [
    { term: "[Term]", def: "[Definition]" },
    { term: "[Term]", def: "[Definition]" },
    { term: "[Term]", def: "[Definition]" },
  ],
};

/* === STATE === */
let currentUnit = Object.keys(vocabData)[0];
let cards = [...vocabData[currentUnit]];
let originalOrder = [...cards];
let idx = 0;

/* === RENDER === */
function renderTabs() {
  const tabsEl = document.getElementById('unitTabs');
  tabsEl.innerHTML = '';
  Object.keys(vocabData).forEach(unit => {
    const btn = document.createElement('button');
    btn.className = 'unit-tab' + (unit === currentUnit ? ' active' : '');
    btn.textContent = unit;
    btn.onclick = () => switchUnit(unit);
    tabsEl.appendChild(btn);
  });
}

function renderCard() {
  const card = cards[idx];
  document.getElementById('termText').textContent = card.term;
  document.getElementById('defText').textContent = card.def;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('counter').innerHTML =
    `<span class="current-num">${idx + 1}</span> / ${cards.length}`;
}

function renderGrid() {
  const grid = document.getElementById('termsGrid');
  grid.innerHTML = '';
  vocabData[currentUnit].forEach(item => {
    const card = document.createElement('div');
    card.className = 'term-card';
    card.innerHTML = `<h4>${item.term}</h4><p>${item.def}</p>`;
    grid.appendChild(card);
  });
}

/* === ACTIONS === */
function flip() {
  document.getElementById('flashcard').classList.toggle('flipped');
}

function next() {
  idx = (idx + 1) % cards.length;
  renderCard();
}

function prev() {
  idx = (idx - 1 + cards.length) % cards.length;
  renderCard();
}

function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  idx = 0;
  renderCard();
}

function resetOrder() {
  cards = [...originalOrder];
  idx = 0;
  renderCard();
}

function switchUnit(unit) {
  currentUnit = unit;
  cards = [...vocabData[currentUnit]];
  originalOrder = [...cards];
  idx = 0;
  renderTabs();
  renderCard();
  renderGrid();
}

/* === KEYBOARD NAV === */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
});

/* === INIT === */
renderTabs();
renderCard();
renderGrid();
</script>
</body>
</html>
